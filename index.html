const rv=reviews(cur);h+=`<div class="card"><h3>Revisões espaçadas pendentes (${rv.length})</h3>${rv.length?rv.slice(0,12).map(x=>`<label class="blk"><input type="checkbox" onchange="rvw(${x[0]},${x[1]})"><span>${D.T[x[0]][1]} <small class="${x[3]<cur?'due':''}">D+${x[2]} · ${BR(x[3])}</small></span></label>`).join(''):'<small>Nada pendente. Marque a data em que estudou cada tópico na aba Tópicos.</small>'}</div>`;
return h}
function mv(n){cur=F(U(cur)+n);go()}
function chk(s,i,v){rec(s).b[i]=v?1:0;save();go()}
function rvw(i,k){const x=st.t[i];x.r=x.r||[0,0,0,0];x.r[k]=1;save();go()}
function semana(){const o=U(cur)-U(st.start),m=o-(((o%7)+7)%7);let h=`<div class="row sp"><button onclick="cur=F(U(cur)-7);go()">‹ semana</button><h2>Semana de ${BR(dt(m))}</h2><button onclick="cur=F(U(cur)+7);go()">semana ›</button></div>`;
for(let i=0;i<7;i++){const s=dt(m+i),e=ent(s);if(!e)continue;const r=st.d[s]||{b:[0,0,0]},n=r.b[0]+r.b[1]+r.b[2];h+=`<div class="card day f${e.w[1][1]}" onclick="cur='${s}';tab='hoje';go()"><div class="row sp"><b>${wk(s)} ${BR(s).slice(0,5)}</b><span>${'✔'.repeat(n)}${'·'.repeat(3-n)} · meta ${e.d[5]}q</span></div><small>${S(e.d[1])}</small></div>`}
return h}
function painel(){const t=TD();let P=0,Pd=0,Q=0,Qd=0,A=0,dias=0;const sj={};
D.W.forEach(w=>w[6].forEach(d=>{const s=dt(d[7]),r=st.d[s];if(s<=t){P+=d[6];Q+=d[5]}if(r){const p=pomo(d,r);Pd+=p;Qd+=r.q||0;A+=r.a||0;if(p>0)dias++;if(r.q){const n=S(d[0]),x=sj[n]||(sj[n]=[0,0]);x[0]+=r.q;x[1]+=r.a||0}}}));
let sk=0,c=t;while(1){const e=ent(c),r=st.d[c];if(!e||!r||pomo(e.d,r)<=0)break;sk++;c=F(U(c)-1)}
const e=ent(t),k=(a,b)=>`<div class="k"><b>${a}</b><small>${b}</small></div>`;
let h=`<h2>Painel</h2><div class="g">${k(e?'Sem '+e.w[0]:'—',e?PHN[e.w[1]]:'fora do plano')}${k(Pd+'/'+P,'pomodoros (feitos/planejados)')}${k((Pd*.5).toFixed(1)+'h','horas brutas')}${k(Qd+'/'+Q,'questões (feitas/meta)')}${k(Qd?Math.round(100*A/Qd)+'%':'—','acerto geral')}${k(dias,'dias com estudo')}${k(sk,'sequência (dias)')}${k(P?Math.round(100*Pd/P)+'%':'—','cumprimento')}${k(st.prova?Math.max(0,U(st.prova)-U(t))+' d':'—','até a prova')}</div><div class="card"><h3>Acerto por matéria</h3>`;
Object.keys(sj).sort().forEach(n=>{const p=Math.round(100*sj[n][1]/sj[n][0]);h+=`<div class="row sp"><span>${n} <small>(${sj[n][0]}q)</small></span><b>${p}%</b></div><div class="bar"><i style="width:${p}%"></i></div>`});
return h+(Object.keys(sj).length?'':'<small>Registre questões na aba Hoje para ver o acerto por matéria.</small>')+'</div>'}
function topicos(){const subs=[...new Set(D.T.map(t=>t[0]))];let h=`<h2>Tópicos e revisões</h2><p><select onchange="sf=this.value;go()"><option value="">Todas as matérias</option>${subs.map(s=>`<option ${sf==s?'selected':''}>${s}</option>`).join('')}</select></p><div class="card"><small>Informe a data em que estudou o tópico: o site calcula as revisões D+1, D+7, D+30 e D+90.</small><table><tr><th>Tópico</th><th>Estudado em</th><th>Revisões</th></tr>`;
D.T.forEach((t,i)=>{if(sf&&t[0]!=sf)return;const x=st.t[i]||{};h+=`<tr><td>${t[1]}<br><small>${t[0]} · previsto ${BR(dt(t[3])).slice(0,5)}</small></td><td><input type="date" value="${x.d||''}" onchange="st.t[${i}]=Object.assign(st.t[${i}]||{},{d:this.value});save();go()"></td><td>${x.d?[1,7,30,90].map((n,k)=>{const due=F(U(x.d)+n),dn=(x.r||[])[k];return`<span class="tag ${!dn&&due<=TD()?'due':''}">${dn?'✔':'D+'+n+' '+BR(due).slice(0,5)}</span>`}).join(' '):''}</td></tr>`});return h+'</table></div>'}
function config(){return`<h2>Ajustes</h2><div class="card"><h3>Datas</h3><p><label>Início do plano (segunda-feira) <input type="date" value="${st.start}" onchange="st.start=this.value;save();go()"></label></p><p><label>Data da prova (quando sair o edital) <input type="date" value="${st.prova}" onchange="st.prova=this.value;save();go()"></label></p><small>Mudar o início move todas as datas do plano. O que você já marcou fica guardado por data.</small></div>
<div class="card"><h3>Backup</h3><small>Seus dados ficam só neste navegador. Faça backup de vez em quando e use-o para levar ao tablet ou celular.</small><p class="row"><button class="pri" onclick="ex()">Baixar backup</button><label class="tag" style="cursor:pointer">Restaurar backup<input type="file" accept=".json" hidden onchange="im(this.files[0])"></label><button onclick="if(confirm('Apagar tudo?')){localStorage.removeItem(K);location.reload()}">Apagar dados</button></p></div>
<div class="card"><h3>Rotina (4 h brutas = 8 pomodoros)</h3><p>Bloco 1: ~07:30, 2 pomodoros · Bloco 2: ~12:30, 3 · Bloco 3: ~19:00, 3. Pomodoro = 25 min de foco + 5 de pausa. Plano mínimo em dia ruim: 4 pomodoros (nunca dois dias seguidos).</p></div>`}
function ex(){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(st)],{type:'application/json'}));a.download='pmdf-backup-'+TD()+'.json';a.click()}
function im(f){const r=new FileReader();r.onload=()=>{try{st=JSON.parse(r.result);save();go()}catch(e){alert('Arquivo inválido')}};r.readAsText(f)}
function go(){nav();$('#v').innerHTML={hoje,semana,painel,topicos,config}[tab]();$('#hd').textContent=BR(TD());window.scrollTo(0,0)}
let mode='f',left=1500,run=0,end=0,iv;const fm=s=>String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0');
function tick(){const l=Math.max(0,Math.round((end-Date.now())/1e3));$('#tt').textContent=fm(l);document.title=fm(l)+' · Plano PMDF';if(l<=0){clearInterval(iv);run=0;beep();if(mode=='f'){st.p[TD()]=(st.p[TD()]||0)+1;save()}mode=mode=='f'?'p':'f';left=mode=='f'?1500:300;draw();$('#tb').textContent='Iniciar'}}
function draw(){$('#tl').textContent=mode=='f'?'Foco':'Pausa';$('#tt').textContent=fm(left);$('#tc').textContent='🍅 '+(st.p[TD()]||0)+' hoje'}
function beep(){try{const c=new AudioContext(),o=c.createOscillator();o.connect(c.destination);o.frequency.value=880;o.start();setTimeout(()=>o.stop(),700)}catch(e){}if(navigator.vibrate)navigator.vibrate(300)}
$('#tb').onclick=()=>{if(run){left=Math.round((end-Date.now())/1e3);clearInterval(iv);run=0;$('#tb').textContent='Continuar'}else{end=Date.now()+left*1e3;run=1;iv=setInterval(tick,500);$('#tb').textContent='Pausar'}};
$('#tr').onclick=()=>{clearInterval(iv);run=0;mode='f';left=1500;draw();$('#tb').textContent='Iniciar'};
draw();go();
</script></body></html>
