function hoje(){const e=ent(cur),r=rec(cur),n=r.b[0]+r.b[1]+r.b[2];let h='';
$('#hd').innerHTML=`<div class="row sp"><button onclick="mv(-1)" style="background:#ffffff30;color:#fff;border:0">‹</button><div style="text-align:center"><h1>${cur==TD()?'Hoje · ':''}${wk(cur)}</h1><small style="color:#ffffffcc">${BR(cur)}</small>${e?`<div><span class="pill">Semana ${e.w[0]} · ${S(e.w[2])}</span></div>`:''}</div><button onclick="mv(1)" style="background:#ffffff30;color:#fff;border:0">›</button></div>${e?`<div class="bar"><i style="width:${n/3*100}%"></i></div><small style="color:#ffffffcc">${n} de 3 blocos concluídos</small>`:''}`;
if(cur!=TD())h+=`<div class="row" style="justify-content:center"><button onclick="cur=TD();go()">Voltar para hoje</button></div>`;
if(!e)return h+`<div class="card m">Não há tarefa para este dia. Se precisar, mude a data de início em ⚙️ Ajustes.</div>`;
agenda(e).forEach((x,i)=>{const t=st.tm[i];h+=`<div class="card it ${r.b[i]?'on':''}" style="--k:${x.c}" onclick="chk(${i})"><div class="tm">${t}<small>até ${hm(t,x.m)}</small></div><div><div class="lb">${x.s} ${x.lb}</div><h3>${x.t}</h3>${x.p?`<p>${x.p}</p>`:''}</div><div class="ck">${r.b[i]?'✓':''}</div></div>`});
h+=`<div class="card"><h2>Questões de hoje <small>(meta ${e.d[5]})</small></h2><div class="row wrap"><label>Fiz <input type="number" min="0" value="${r.q||''}" onchange="rec(cur).q=+this.value;save();go()"></label><label>Acertei <input type="number" min="0" value="${r.a||''}" onchange="rec(cur).a=+this.value;save();go()"></label><b style="font-size:22px">${r.q?Math.round(100*r.a/r.q)+'%':''}</b></div></div>`;
const rv=[];D.T.forEach((t,i)=>{const x=st.t[i];if(x&&x.d){const k=U(cur)-U(x.d);if([1,7,30,90].includes(k))rv.push(`${clean(t[1])} <small>(estudado há ${k} dia${k>1?'s':''})</small>`)}});
if(rv.length)h+=`<div class="card"><h2>🔁 Revisar hoje</h2>${rv.map(x=>`<div class="tp">${x}</div>`).join('')}</div>`;
return h}
function semana(){$('#hd').innerHTML=`<h1>Semana</h1><small style="color:#ffffffcc">Toque em um dia para abrir</small>`;const o=U(cur)-U(st.start),m=o-(((o%7)+7)%7);let h=`<div class="row sp"><button onclick="cur=F(U(cur)-7);go()">‹</button><b>${BR(dt(m)).slice(0,5)} a ${BR(dt(m+6)).slice(0,5)}</b><button onclick="cur=F(U(cur)+7);go()">›</button></div>`;
for(let i=0;i<7;i++){const s=dt(m+i),e=ent(s);if(!e)continue;const r=st.d[s]||{b:[0,0,0]},n=r.b[0]+r.b[1]+r.b[2],a=agenda(e)[1];h+=`<div class="card it ${s==TD()?'today':''}" style="--k:${a.c}" onclick="cur='${s}';tab='hoje';go()"><div class="tm">${wk(s).slice(0,3)}<small>${BR(s).slice(0,5)}</small></div><div><div class="lb">${a.s} ${a.lb}</div><h3>${a.t}</h3></div><div class="ck" style="${n==3?'background:var(--ok);border-color:var(--ok)':'color:var(--m)'}">${n==3?'✓':n+'/3'}</div></div>`}return h}
function mat(){$('#hd').innerHTML=`<h1>Matérias</h1><small style="color:#ffffffcc">Marque o que você já estudou</small>`;const by={};D.T.forEach((t,i)=>(by[t[0]]=by[t[0]]||[]).push(i));let h='';
Object.keys(by).forEach(n=>{const l=by[n],ok=l.filter(i=>st.t[i]&&st.t[i].d).length,x=sj(n);h+=`<details><summary>${x[0]} ${n}<div class="row" style="margin-top:6px"><div class="bar" style="flex:1"><i style="width:${ok/l.length*100}%"></i></div><small>${ok}/${l.length}</small></div></summary>${l.map(i=>`<label class="tp"><input type="checkbox" ${st.t[i]&&st.t[i].d?'checked':''} onchange="st.t[${i}]=this.checked?{d:TD()}:{};save();go()"><span>${clean(D.T[i][1])}<br><small>previsto: ${BR(dt(D.T[i][3])).slice(0,5)}${st.t[i]&&st.t[i].d?' · estudado em '+BR(st.t[i].d).slice(0,5):''}</small></span></label>`).join('')}</details>`});return h}
function prog(){$('#hd').innerHTML=`<h1>Progresso</h1><small style="color:#ffffffcc">Seu desempenho até aqui</small>`;const t=TD();let Pd=0,Q=0,A=0,dias=0;const sb={};
D.W.forEach(w=>w[6].forEach(d=>{const r=st.d[dt(d[7])];if(r){const p=pomo(d,r);Pd+=p;Q+=r.q||0;A+=r.a||0;if(p>0)dias++;if(r.q){const n=S(d[0]),x=sb[n]||(sb[n]=[0,0]);x[0]+=r.q;x[1]+=r.a||0}}}));
let sk=0,c=t;for(;;){const e=ent(c),r=st.d[c];if(!e||!r||pomo(e.d,r)<=0)break;sk++;c=F(U(c)-1)}
const k=(a,b)=>`<div class="k"><b>${a}</b><small>${b}</small></div>`;
let h=`<div class="g">${k(dias,'dias estudados')}${k('🔥 '+sk,'dias seguidos')}${k((Pd*.5).toFixed(1)+' h','horas de estudo')}${k(Q,'questões feitas')}${k(Q?Math.round(100*A/Q)+'%':'—','taxa de acerto')}${k(st.prova?Math.max(0,U(st.prova)-U(t))+' dias':'—','para a prova')}</div><div class="card"><h2>Acerto por matéria</h2>`;
Object.keys(sb).sort().forEach(n=>{const p=Math.round(100*sb[n][1]/sb[n][0]);h+=`<div class="row sp"><span>${sj(n)[0]} ${n}</span><b>${p}%</b></div><div class="bar" style="margin:4px 0 10px"><i style="width:${p}%"></i></div>`});
return h+(Object.keys(sb).length?'':'<small>Anote suas questões em “Hoje” para ver aqui.</small>')+'</div>'}
function cfg(){$('#hd').innerHTML=`<h1>Ajustes</h1>`;return`<div class="card"><h2>Datas</h2><p><label>Início do plano (uma segunda-feira)<br><input type="date" value="${st.start}" onchange="st.start=this.value;save();go()"></label></p><p><label>Data da prova (quando sair o edital)<br><input type="date" value="${st.prova}" onchange="st.prova=this.value;save();go()"></label></p></div>
<div class="card"><h2>Horários dos blocos</h2><div class="row wrap">${['Manhã','Meio-dia','Noite'].map((n,i)=>`<label>${n}<br><input type="time" value="${st.tm[i]}" onchange="st.tm[${i}]=this.value;save();go()"></label>`).join('')}</div></div>
<div class="card"><h2>Backup</h2><p class="m">Seus dados ficam só neste aparelho. Baixe um backup de vez em quando e use-o para levar ao tablet ou celular.</p><div class="row wrap"><button onclick="ex()">⬇️ Baixar</button><label style="cursor:pointer;border:1px solid var(--b);border-radius:12px;padding:9px 12px">⬆️ Restaurar<input type="file" accept=".json" hidden onchange="im(this.files[0])"></label><button onclick="if(confirm('Apagar tudo?')){localStorage.removeItem(K);location.reload()}">🗑️ Apagar</button></div></div>`}
function ex(){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(st)],{type:'application/json'}));a.download='backup-pmdf-'+TD()+'.json';a.click()}
function im(f){const r=new FileReader();r.onload=()=>{try{st=Object.assign(st,JSON.parse(r.result));save();go()}catch(e){alert('Arquivo inválido')}};r.readAsText(f)}
function go(){$('#nav').innerHTML=TABS.map(t=>`<button class="${tab==t[0]?'on':''}" onclick="tab='${t[0]}';go()"><b>${t[1]}</b>${t[2]}</button>`).join('');$('#v').innerHTML={hoje,semana,mat,prog,cfg}[tab]();window.scrollTo(0,0)}
let mode='f',left=1500,run=0,end=0,iv;const fm=s=>String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0');
function tick(){const l=Math.max(0,Math.round((end-Date.now())/1e3));$('#tt').textContent=fm(l);document.title=fm(l)+' · Plano PMDF';if(l<=0){clearInterval(iv);run=0;beep();if(mode=='f'){st.p[TD()]=(st.p[TD()]||0)+1;save()}mode=mode=='f'?'p':'f';left=mode=='f'?1500:300;draw();$('#tb').textContent='▶'}}
function draw(){$('#tl').textContent=mode=='f'?'Foco':'Pausa';$('#tt').textContent=fm(left);$('#tc').textContent='🍅'+(st.p[TD()]||0)}
function beep(){try{const c=new AudioContext(),o=c.createOscillator();o.connect(c.destination);o.frequency.value=880;o.start();setTimeout(()=>o.stop(),700)}catch(e){}if(navigator.vibrate)navigator.vibrate(300)}
$('#tb').onclick=()=>{if(run){left=Math.round((end-Date.now())/1e3);clearInterval(iv);run=0;$('#tb').textContent='▶'}else{end=Date.now()+left*1e3;run=1;iv=setInterval(tick,500);$('#tb').textContent='⏸'}};
$('#tr').onclick=()=>{clearInterval(iv);run=0;mode='f';left=1500;draw();$('#tb').textContent='▶'};
draw();go();
</script></body></html>
